server {
    listen 80;
    server_name localhost;

    # 拦截敏感文件后缀（包括 .db, .sqlite, .env, .git 等）
    location ~* \.(db|sqlite|env|git|sql|log|bak|swp)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- 前端请求转发 ---
    location / {
        proxy_pass http://frontend:8501/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # proxy_ignore_headers Date;
    }

    # --- 后端 API 请求转发 ---
    # 注意：这里匹配 /ask/
    location /ask/ {
        # 启用限流
        limit_req zone=ask_limit burst=3 nodelay; 
        # 启用并发连接限制 (防止单IP占满所有SSE连接)
        limit_conn conn_limit 5; 
        
        # 自定义限流返回状态码 (可选，默认503)
        limit_req_status 429;
        limit_conn_status 429;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://backend:8001/ask/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 拦截可疑路径 ---
    # 如果业务里没有 /mcp 和 /sse，直接返回 404 或 403，减少后端压力
    location ~ ^/(mcp|sse)/ {
        limit_req zone=short_api_limit burst=5 nodelay;
        return 404; 
        # 或者如果想转发给后端处理但限流：
        # proxy_pass http://backend:8001;
    }

    # 短接口共用限流
    location ~ ^/(feedback|history)/ {
        limit_req zone=short_api_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 新增：健康检查转发 ---
    location /health/ {
        limit_req zone=health_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8001/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


