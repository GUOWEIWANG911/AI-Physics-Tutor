http{
    # 1. 定义限流区域 (按 IP 限制)
    # zone=api_limit:10m -> 分配10MB内存存储IP状态
    # rate=5r/s -> 每秒允许5个请求 (根据你的业务调整，SSE流式接口建议设低一点)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    
    # 2. 定义连接数限制区域
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;
        server_name localhost;

        # --- 前端请求转发 ---
        location / {
            proxy_pass http://frontend:8501/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # proxy_ignore_headers Date;
        }

        # --- 后端 API 请求转发 ---
        # 注意：这里匹配 /ask/
        location /ask/ {
            # 启用限流
            limit_req zone=api_limit burst=10 nodelay; 
            # 启用并发连接限制 (防止单IP占满所有SSE连接)
            limit_conn conn_limit 5; 
            
            # 自定义限流返回状态码 (可选，默认503)
            limit_req_status 429;
            limit_conn_status 429;

            proxy_pass http://backend:8001/ask/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 长连接超时设置 (防止 Nginx 过早切断流)
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # --- 拦截可疑路径 (如截图中的 /mcp, /sse) ---
        # 如果你的业务里没有 /mcp 和 /sse，直接返回 404 或 403，减少后端压力
        location ~ ^/(mcp|sse)/ {
            limit_req zone=api_limit burst=5 nodelay;
            return 404; 
            # 或者如果你想转发给后端处理但限流：
            # proxy_pass http://backend:8001;
        }

        # --- 新增：健康检查转发 ---
        location /health/ {
            proxy_pass http://backend:8001/health/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}


