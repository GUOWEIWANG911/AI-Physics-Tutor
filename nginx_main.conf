events {
    worker_connections 1024;
}

http {
    # --- 限流定义 ---
    # 长耗时接口：放宽速率，避免 SSE 连接占满令牌
    limit_req_zone $binary_remote_addr zone=ask_limit:10m rate=2r/s;

    # 短接口：正常限流
    limit_req_zone $binary_remote_addr zone=short_api_limit:10m rate=10r/s;
    
    # 健康检查：严格限流
    limit_req_zone $binary_remote_addr zone=health_limit:10m rate=1r/s;

    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 引入 conf.d 下的配置（包括你挂载的 default.conf）
    include /etc/nginx/conf.d/*.conf;
}